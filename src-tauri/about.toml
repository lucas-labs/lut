# cargo-about: the Rust half of lut's third-party notices (E25-03, `scripts/notices.mjs`).
#
# `accepted` is lut's license allowlist, for crates and npm packages alike (`scripts/notices.mjs` reads it too): a
# dependency under any other license fails the notices, and so the release build, until it is reviewed and added
# here. MPL-2.0 and EPL-2.0 are weak copyleft: lut ships those packages unmodified, and the notices name where their
# source is.
accepted = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "0BSD",
    "Zlib",
    "Unicode-3.0",
    "BSL-1.0",
    "CC0-1.0",
    "Unlicense",
    "MPL-2.0",
    "EPL-2.0",
]

# The systems lut ships for; crates only other targets use are left out.
targets = [
    "x86_64-pc-windows-msvc",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
]

# Build scripts and test-only crates are not part of the shipped binaries.
ignore-build-dependencies = true
ignore-dev-dependencies = true
