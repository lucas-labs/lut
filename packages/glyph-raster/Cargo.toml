[package]
name = "lut-glyph-raster"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "Hinted glyph rasterizer for lut's terminal, built to WebAssembly."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
skrifa = { version = "0.50.0", default-features = false, features = ["std"] }
zeno = { version = "0.3.3", default-features = false, features = ["std", "eval"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# Its own workspace: built for wasm32, never part of the app's Cargo workspace.
[workspace]
