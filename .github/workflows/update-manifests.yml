# Update manifests (E25-02, .docs/development/releasing.md): publishing a release brings the permanent `updater`
# release, which installed lut reads, up to date. Every run looks at all published releases, not only the one that
# started it: stable.json serves the newest stable release and beta.json the newest of all, each copied from that
# release's latest.json with its notes and date, and each replaced only when that release is newer than the version it
# holds. A canceled or failed run is therefore made good by the next one, and publishing an older draft late never
# moves a channel back.
name: Update manifests

on:
  release:
    types: [published]
  workflow_dispatch:

# One run at a time, so two runs never read and replace the same manifest together.
concurrency:
  group: update-manifests
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    name: update
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Bring the channel manifests up to date
        shell: bash
        run: |
          set -euo pipefail
          tags=$(gh release list --exclude-drafts --limit 1000 --json tagName -q '.[].tagName')
          # shellcheck disable=SC2086
          heads=$(node scripts/release.mjs --heads $tags)
          echo "$heads" >> "$GITHUB_STEP_SUMMARY"

          if ! gh release view updater >/dev/null 2>&1; then
            gh release create updater --target master --latest=false --title "Update manifests" \
              --notes "The update manifests installed lut reads. Replaced when a release is published; see .docs/development/releasing.md."
          fi
          # A failure here stops the run: only an asset missing from this list counts as no manifest yet.
          assets=$(gh release view updater --json assets -q '.assets[].name')

          for channel in stable beta; do
            tag=$(sed -n "s/^$channel=//p" <<< "$heads")
            [ -n "$tag" ] || { echo "$channel.json: no published release" >> "$GITHUB_STEP_SUMMARY"; continue; }
            version=${tag#v}
            current=""
            if grep -qx "$channel.json" <<< "$assets"; then
              rm -rf current
              gh release download updater --pattern "$channel.json" --dir current
              current=$(node -p "require('./current/$channel.json').version")
            fi
            if [ "$(node scripts/release.mjs --newer "$version" "$current")" != true ]; then
              echo "$channel.json: keeps $current" >> "$GITHUB_STEP_SUMMARY"
              continue
            fi
            rm -rf release
            gh release download "$tag" --pattern latest.json --dir release
            gh release view "$tag" --json body -q .body > notes.md
            published=$(gh release view "$tag" --json publishedAt -q .publishedAt)
            node scripts/build-manifest.mjs publish release/latest.json notes.md "$published"
            cp release/latest.json "$channel.json"
            gh release upload updater "$channel.json" --clobber
            echo "$channel.json: ${current:-none} -> $version" >> "$GITHUB_STEP_SUMMARY"
          done
