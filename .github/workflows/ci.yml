# Quality gate (E01-05): every PR to master and every push to master runs lint, format, type checks, tests and the
# build. The frontend checks don't depend on the OS and run on Ubuntu (E01-24); the backend runs on Windows, the primary
# platform. macOS and Linux backend jobs are added by E24-01.
name: ci

on:
  pull_request:
    branches: [master]
    paths-ignore: ['.docs/**', '**/*.md']
  push:
    branches: [master]
    paths-ignore: ['.docs/**', '**/*.md']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: frontend (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # pnpm version comes from `packageManager` in package.json.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm check-types
      - run: pnpm test
      - run: pnpm build
      - run: pnpm knip

  frontend-windows:
    name: frontend shell tests (windows)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The tests whose Windows path differs from the Linux one: PowerShell quoting and the Bash hooks under Git Bash.
      - run: >-
          pnpm vitest run --reporter=verbose
          src/modules/terminal/lib/quoteShellPath.test.ts
          src/modules/terminal/ghostty/bashPromptHooks.test.ts

  backend:
    name: backend (windows)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # tauri-build needs the CLI sidecar (bundle.externalBin) to exist before the app crate compiles.
      - run: node scripts/build-cli.mjs
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --all --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked --workspace --all-targets -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked --workspace
