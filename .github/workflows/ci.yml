# Quality gate (E01-05): every PR to master and every push to master runs lint, format, type checks, tests and the
# build. The frontend checks don't depend on the OS and run on Ubuntu (E01-24); the backend runs on Windows, the primary
# platform. macOS and Linux backend jobs are added by E24-01. On a pull request each job runs only when files it depends
# on changed (E01-25); a push to master runs every job. Every pull request starts the workflow, even a docs-only one
# (its jobs are skipped), so the checks master requires always report (E04-09).
name: ci

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
    paths-ignore: ['.docs/**', '**/*.md']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - if: github.event_name == 'pull_request'
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          # A file counts when it matches a pattern and none of the '!' ones.
          predicate-quantifier: some-with-excludes
          filters: |
            # Frontend tests and vite.config.ts read files under src-tauri, so only Rust-only and docs-only changes
            # skip it.
            frontend:
              - '**'
              - '!**/*.rs'
              - '!src-tauri/Cargo.toml'
              - '!src-tauri/Cargo.lock'
              - '!src-tauri/crates/**'
              - '!.docs/**'
              - '!**/*.md'
            # read_policy.rs embeds pathPolicy.json; the job builds the CLI sidecar with build-cli.mjs.
            backend:
              - 'src-tauri/**'
              - '!**/*.md'
              - 'src/lib/security/pathPolicy.json'
              - 'scripts/build-cli.mjs'
              - '.github/workflows/ci.yml'

  frontend:
    name: frontend (ubuntu)
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # pnpm version comes from `packageManager` in package.json.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm check-types
      - run: pnpm test
      - run: pnpm build
      - run: pnpm knip

  frontend-windows:
    name: frontend shell tests (windows)
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.frontend == 'true'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The tests whose Windows path differs from the Linux one: PowerShell quoting and prompt markers, and the Bash
      # hooks under Git Bash.
      - run: >-
          pnpm vitest run --reporter=verbose
          src/modules/terminal/lib/quoteShellPath.test.ts
          src/modules/terminal/ghostty/bashPromptHooks.test.ts
          src/modules/terminal/ghostty/powershellPrompt.test.ts

  backend:
    name: backend (windows)
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.backend == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # tauri-build needs the CLI sidecar (bundle.externalBin) to exist before the app crate compiles.
      - run: node scripts/build-cli.mjs
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --all --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked --workspace --all-targets -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked --workspace
