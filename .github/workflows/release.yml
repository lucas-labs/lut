# Release (E25-02, .docs/development/releasing.md): a `vX.Y.Z` or `vX.Y.Z-beta.N` tag, made by `pnpm release`, builds
# every target, signs the updater bundles, writes one latest.json after all of them and creates a draft release. The
# draft is reviewed and published by hand; publishing it runs update-manifests.yml. A manual run builds and checks
# everything and keeps the bundles as workflow artifacts, without a release.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      beta: ${{ steps.version.outputs.beta }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # A tag must be vX.Y.Z or vX.Y.Z-beta.N, agree with the versions in the files, and be on master.
      - id: version
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version=$(node scripts/release.mjs --verify "$GITHUB_REF_NAME")
            git merge-base --is-ancestor "$GITHUB_SHA" origin/master \
              || { echo "::error::$GITHUB_REF_NAME is not on master"; exit 1; }
            tag="$GITHUB_REF_NAME"
          else
            version=$(node -p "require('./package.json').version")
            tag="v$version"
          fi
          beta=false
          case "$version" in *-beta.*) beta=true ;; esac
          { echo "version=$version"; echo "tag=$tag"; echo "beta=$beta"; } >> "$GITHUB_OUTPUT"
          echo "Release $tag (beta: $beta)" >> "$GITHUB_STEP_SUMMARY"

  build:
    name: build (${{ matrix.name }})
    needs: check
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - name: macos-arm64
            runner: macos-latest
            target: aarch64-apple-darwin
            bundles: app,dmg
            arch: aarch64
          # Cross-compiled on the arm64 runner, as Terax did.
          - name: macos-x64
            runner: macos-latest
            target: x86_64-apple-darwin
            bundles: app,dmg
            arch: x64
          # Ubuntu 22.04: the oldest supported runner, so the glibc a Linux bundle needs stays low.
          - name: linux-x64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: appimage,deb,rpm
            appimage-arch: x86_64
          - name: linux-arm64
            runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            bundles: appimage,deb,rpm
            appimage-arch: aarch64
    defaults:
      run:
        shell: bash
    env:
      BUNDLE: src-tauri/target/${{ matrix.target }}/release/bundle
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libssl-dev libxdo-dev libayatana-appindicator3-dev
          patchelf rpm
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}
      # The third-party notices (E25-03).
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about@0.9.3
      - run: pnpm install --frozen-lockfile

      # `createUpdaterArtifacts` is on only here (E25-04): the build signs every updater bundle with the secret key.
      # LUT_CLI_TARGET builds the lut-cli sidecar for this target, not the runner's.
      - name: Build
        env:
          LUT_CLI_TARGET: ${{ matrix.target }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: >-
          pnpm tauri build --ci --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
          --config '{"bundle":{"createUpdaterArtifacts":true}}'

      # The AppImage bundles the build runner's libwayland, older than the Mesa of recent distributions: EGL then
      # fails. Removing it makes the AppImage use the system's (it is on the AppImage excludelist for this reason).
      # Repacking changes the file, so it is signed again. Adapted from Terax's release workflow.
      - name: Remove libwayland from the AppImage and sign it again
        if: runner.os == 'Linux'
        env:
          APPIMAGE_ARCH: ${{ matrix.appimage-arch }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          appimage=$(ls "$BUNDLE"/appimage/*.AppImage)
          name=$(basename "$appimage")
          work=$(mktemp -d)
          cp "$appimage" "$work/"
          pushd "$work" >/dev/null
          chmod +x "./$name"
          "./$name" --appimage-extract >/dev/null
          test -x squashfs-root/usr/bin/lut || { echo "::error::lut is missing from the AppImage"; exit 1; }
          find squashfs-root \( -type f -o -type l \) -name 'libwayland-*.so*' -print -delete
          curl -fsSL -o appimagetool.AppImage \
            "https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-${APPIMAGE_ARCH}.AppImage"
          chmod +x appimagetool.AppImage
          ARCH="$APPIMAGE_ARCH" ./appimagetool.AppImage --appimage-extract-and-run squashfs-root "$name"
          # Check the repacked image before it replaces the original.
          rm -rf squashfs-root
          chmod +x "./$name"
          "./$name" --appimage-extract >/dev/null
          if find squashfs-root -name 'libwayland-*.so*' -print -quit | grep -q .; then
            echo "::error::libwayland is still in the repacked AppImage"; exit 1
          fi
          test -x squashfs-root/usr/bin/lut || { echo "::error::lut is missing from the repacked AppImage"; exit 1; }
          squashfs-root/usr/bin/lut-cli --help >/dev/null
          popd >/dev/null
          cp "$work/$name" "$appimage"
          rm -f "$appimage.sig"
          pnpm tauri signer sign "$appimage"

      # Every file the updater uses has its .sig. The two macOS builds both name their bundle lut.app.tar.gz, so it is
      # renamed after its architecture.
      - name: Collect the bundles
        run: |
          set -euo pipefail
          mkdir out
          collect() { test -s "$1" || { echo "::error::$1 is missing or empty"; exit 1; }; cp "$1" "${2:-out/}"; }
          signed() { collect "$1" "${2:-out/}"; collect "$1.sig" "${2:+$2.sig}"; }
          case "${{ runner.os }}" in
            Windows)
              for f in "$BUNDLE"/nsis/*-setup.exe; do signed "$f"; done ;;
            macOS)
              for f in "$BUNDLE"/dmg/*.dmg; do collect "$f"; done
              signed "$BUNDLE/macos/lut.app.tar.gz" "out/lut_${VERSION}_${{ matrix.arch }}.app.tar.gz" ;;
            Linux)
              for f in "$BUNDLE"/appimage/*.AppImage "$BUNDLE"/deb/*.deb "$BUNDLE"/rpm/*.rpm; do signed "$f"; done ;;
          esac
          ls -l out >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: bundles-${{ matrix.name }}
          path: out/
          if-no-files-found: error

  # One job after every target writes latest.json (Terax merged it from each job and had to patch it afterwards).
  manifest:
    name: manifest
    needs: [check, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      TAG: ${{ needs.check.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          pattern: bundles-*
          path: bundles
          merge-multiple: true
      - run: node scripts/build-manifest.mjs build bundles "$TAG" "$GITHUB_REPOSITORY"
      - uses: actions/upload-artifact@v4
        with:
          name: latest
          path: bundles/latest.json
      # Only for a pushed tag (a manual run may target a tag too), and never published here: the draft waits for a
      # review.
      - name: Create the draft release
        if: github.event_name == 'push' && github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          BETA: ${{ needs.check.outputs.beta }}
        run: |
          set -euo pipefail
          prerelease=()
          [ "$BETA" = true ] && prerelease=(--prerelease)
          gh release create "$TAG" --draft "${prerelease[@]}" --verify-tag --generate-notes \
            --title "lut $TAG" bundles/*
