packages:
  - packages/*

# Run package.json scripts with pnpm's cross-platform shell so POSIX syntax such as `VAR=x cmd`
# works the same on Windows (cmd.exe) as on macOS and Linux.
shellEmulator: true
minimumReleaseAge: 4320
minimumReleaseAgeStrict: true
catalog:
  '@lezer/highlight': 1.2.5
overrides:
  # Parsers and themes must share Lezer's highlighting metadata identity.
  '@lezer/highlight': 'catalog:'
  # Single bundled copy of shared libraries (dist-graph.mjs fails the build on
  # duplicates). codemirror-languageserver pins marked 16, so its lazy chunk used
  # to ship a second copy. Scoped to the current major so a major bump drops the
  # override; re-check with `pnpm why` when bumping it.
  'codemirror-languageserver@1>marked': 17.0.6
allowBuilds:
  esbuild: true
  msgpackr-extract: false
  msw: true
